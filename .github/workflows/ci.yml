name: CI

on:
  push:
    branches: [main]
  # No branches filter: a pull request based on another pull request's branch is
  # still a pull request, and a stacked one got no CI at all - not conformance,
  # not even the build. The scope is resolved from the diff either way, so a
  # stacked pull request tests exactly the fixtures it touches. The push filter
  # stays: only main runs the full matrix.
  pull_request:
  workflow_dispatch:

# Prevent concurrent conformance tests (CI and nightly share test resources)
concurrency:
  group: gcp-conformance-tests
  cancel-in-progress: false

jobs:
  reuse-compliance:
    name: REUSE License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Build
        run: make build

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run unit tests
        run: make test-unit

      - name: Self-check CI scripts
        run: ./scripts/ci/conformance-scope_test.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

      # Every conformance job shells out to scripts/ci, so a script that does not
      # parse fails all 176 of them at once with a bash syntax error and no test
      # output - which is exactly how the 2026-09-01 nightly failed. Nothing else
      # in CI reads these files, so nothing else catches it. This is one second.
      - name: Shell scripts parse
        run: |
          rc=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::does not parse"; rc=1; }
          done
          exit $rc

  pkl-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Validate Pkl manifest
        run: |
          pkl eval formae-plugin.pkl --format json > /dev/null
          echo "Manifest validated successfully"

  verify-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Verify schema
        run: make verify-schema

  # Resolve which test cases this run exercises: the whole testdata/ matrix on
  # push, dispatch or a `full-conformance` label; only the cases a pull request
  # touched otherwise. A PR touching no fixture resolves to zero and skips the
  # conformance jobs and their cleanup entirely.
  discover-tests:
    needs: [build, lint, pkl-validate, verify-schema, test-unit]
    runs-on: ubuntu-latest
    outputs:
      test-cases: ${{ steps.discover.outputs.test-cases }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The pull_request path diffs against the base commit, which needs the
          # full history. Not a `github.event_name` ternary: `... && 0 || 1`
          # yields 1 on a pull request, because 0 is falsy in a GitHub
          # expression and `||` then takes the right branch.
          fetch-depth: 0

      - name: Resolve conformance scope
        id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-conformance') }}
        run: ./scripts/ci/conformance-scope.sh

  # Clean up test resources before running any conformance tests
  pre-cleanup:
    needs: [discover-tests]
    if: needs.discover-tests.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Clean test resources
        # SSL certificates are capped at 10 per project globally and the cap is
        # not per-run: a case that leaves one behind eats the budget for every
        # later run, and once it is full every certificate insert is refused.
        # Nine leaked certificates is how target-https-proxy, target-ssl-proxy
        # and ssl-certificate all failed in the 2026-09-03 nightly. The sweep
        # only takes names matching SWEEP_RE and never the ones in KEEP_RE.
        env:
          FORMAE_SWEEP_SSL_CERTIFICATES: "1"
        run: ./scripts/ci/clean-environment.sh

  # Conformance tests run the full CRUD lifecycle against real GCP resources.
  # Each test case runs in its own isolated job via matrix strategy.
  # Cleanup is handled by separate pre/post-cleanup jobs, NOT per test.
  # An empty matrix vector is a hard error in Actions, so the count gate here is
  # what makes "this PR touched no fixture" a skip rather than a red run.
  conformance-tests:
    needs: [discover-tests, pre-cleanup]
    if: needs.discover-tests.outputs.count != '0'
    runs-on: ubuntu-latest
    # Raised to accommodate Cloud SQL: the CRUD + discovery lifecycle
    # provisions three instances sequentially (5-15 min each).
    timeout-minutes: 75
    strategy:
      matrix:
        test-case: ${{ fromJson(needs.discover-tests.outputs.test-cases) }}
      max-parallel: 25
      fail-fast: false
    permissions:
      id-token: write
      contents: read

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install plugin
        run: make install

      # The conformance binary pulls test-only modules that "make install" does
      # not need, so they are fetched when the test compiles - and a transient
      # "read https://proxy.golang.org/..." there fails the case outright, after
      # the job has already spent minutes on setup and, for the split cases,
      # after a phase has already run against real infrastructure. Fetch them up
      # front and retry, so a proxy hiccup costs seconds instead of a red run.
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $attempt), retrying in 15s"
            sleep 15
          done
          echo "go mod download still failing after 3 attempts"
          exit 1

      - name: Run conformance test (${{ matrix.test-case }})
        env:
          FORMAE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: ./scripts/ci/run-conformance-case.sh ${{ matrix.test-case }} both

  # Clean up test resources after all conformance tests (always runs)
  post-cleanup:
    needs: [conformance-tests]
    if: always() && needs.conformance-tests.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Clean test resources
        # SSL certificates are capped at 10 per project globally and the cap is
        # not per-run: a case that leaves one behind eats the budget for every
        # later run, and once it is full every certificate insert is refused.
        # Nine leaked certificates is how target-https-proxy, target-ssl-proxy
        # and ssl-certificate all failed in the 2026-09-03 nightly. The sweep
        # only takes names matching SWEEP_RE and never the ones in KEEP_RE.
        env:
          FORMAE_SWEEP_SSL_CERTIFICATES: "1"
        run: ./scripts/ci/clean-environment.sh

  # Notify when build is fixed (was red, now green)
  notify-fixed:
    needs: [build, test-unit, lint, pkl-validate, verify-schema, conformance-tests, post-cleanup]
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push'
    steps:
      - name: Check if previous run failed
        id: check_previous
        uses: actions/github-script@v9
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: context.ref.replace('refs/heads/', ''),
              per_page: 2,
              status: 'completed'
            });

            // Get previous run (skip current which isn't completed yet)
            const previousRun = runs.data.workflow_runs.find(run => run.id !== context.runId);

            if (previousRun && previousRun.conclusion === 'failure') {
              return 'true';
            }
            return 'false';
          result-encoding: string

      - name: Notify Slack (Fixed)
        if: steps.check_previous.outputs.result == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: CI fixed on ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *CI fixed* on `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  # Notify on failure
  notify-failure:
    needs: [build, test-unit, lint, pkl-validate, verify-schema, conformance-tests, post-cleanup]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: CI failed on ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *CI failed* on `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
