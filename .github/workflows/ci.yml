name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_conformance:
        description: 'Run conformance tests'
        required: false
        default: 'false'
        type: boolean

# Prevent concurrent conformance tests (CI and nightly share test resources)
concurrency:
  group: gcp-conformance-tests
  cancel-in-progress: false

jobs:
  reuse-compliance:
    name: REUSE License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Build
        run: make build

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run unit tests
        run: make test-unit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: latest

  pkl-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Validate Pkl manifest
        run: |
          pkl eval formae-plugin.pkl --format json > /dev/null
          echo "Manifest validated successfully"

  verify-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - name: Verify schema
        run: make verify-schema

  # Discover test cases from testdata/ directory for matrix strategy
  discover-tests:
    needs: [build, lint, pkl-validate, verify-schema, test-unit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    outputs:
      test-cases: ${{ steps.discover.outputs.test-cases }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Discover test cases
        id: discover
        run: |
          # Find all *.pkl files in testdata/, exclude -update.pkl and -replace.pkl variants,
          # and extract the base test case name
          TEST_CASES=$(ls testdata/*.pkl 2>/dev/null \
            | xargs -n1 basename \
            | grep -v '\-update\.pkl$' \
            | grep -v '\-replace\.pkl$' \
            | sed 's/\.pkl$//' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Discovered test cases: ${TEST_CASES}"
          echo "test-cases=${TEST_CASES}" >> "$GITHUB_OUTPUT"

  # Clean up test resources before running any conformance tests
  pre-cleanup:
    needs: [discover-tests]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Clean test resources
        run: ./scripts/ci/clean-environment.sh

  # Conformance tests run the full CRUD lifecycle against real GCP resources.
  # Each test case runs in its own isolated job via matrix strategy.
  # Cleanup is handled by separate pre/post-cleanup jobs, NOT per test.
  conformance-tests:
    needs: [discover-tests, pre-cleanup]
    runs-on: ubuntu-latest
    # Raised to accommodate Cloud SQL: the CRUD + discovery lifecycle
    # provisions three instances sequentially (5-15 min each).
    timeout-minutes: 75
    strategy:
      matrix:
        test-case: ${{ fromJson(needs.discover-tests.outputs.test-cases) }}
      max-parallel: 25
      fail-fast: false
    permissions:
      id-token: write
      contents: read

    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set up Pkl
        uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.30.0

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install plugin
        run: make install

      # The conformance binary pulls test-only modules that "make install" does
      # not need, so they are fetched when the test compiles - and a transient
      # "read https://proxy.golang.org/..." there fails the case outright, after
      # the job has already spent minutes on setup and, for the split cases,
      # after a phase has already run against real infrastructure. Fetch them up
      # front and retry, so a proxy hiccup costs seconds instead of a red run.
      - name: Download Go modules
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "go mod download failed (attempt $attempt), retrying in 15s"
            sleep 15
          done
          echo "go mod download still failing after 3 attempts"
          exit 1

      - name: Run conformance test (${{ matrix.test-case }})
        env:
          FORMAE_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          # Slow resources (Cloud SQL: 5-10 min/instance) need raised timeouts.
          # TIMEOUT sets the per-operation poll (FORMAE_TEST_TIMEOUT); the
          # discovery and OOB timeouts are separate env vars the SDK reads.
          TIMEOUT_ARG=""
          case "${{ matrix.test-case }}" in
            cloudsql-instance)
              # Cloud SQL provisions an instance per create (5-15 min each).
              # The CRUD lifecycle creates two (initial + OOB-delete re-apply)
              # and discovery creates a third, so allow 30 min per operation.
              TIMEOUT_ARG="TIMEOUT=30"
              export FORMAE_TEST_DISCOVERY_TIMEOUT=30
              export FORMAE_TEST_OOB_TIMEOUT=30
              export FORMAE_TEST_OOB_DELETE_TIMEOUT=15
              ;;
            alloydb-cluster|alloydb-instance|alloydb-user|alloydb-backup)
              # An AlloyDB cluster takes 10-25 min to provision, and instance,
              # user and backup each create one first, so every case in this
              # family pays that cost before its own resource starts. The 5m
              # default expires long before the cluster is READY, which is what
              # "timeout waiting for command" on Create means here.
              TIMEOUT_ARG="TIMEOUT=30"
              export FORMAE_TEST_DISCOVERY_TIMEOUT=30
              export FORMAE_TEST_OOB_TIMEOUT=30
              export FORMAE_TEST_OOB_DELETE_TIMEOUT=20
              ;;
            servicenetworking-connection)
              # PSA connections are async and global (VPC peering); create and
              # especially discovery take longer to surface in inventory than any
              # other resource. Give them the same 30m window as Cloud SQL - 15m
              # was borderline and timed out under load.
              TIMEOUT_ARG="TIMEOUT=30"
              export FORMAE_TEST_DISCOVERY_TIMEOUT=30
              export FORMAE_TEST_OOB_TIMEOUT=30
              export FORMAE_TEST_OOB_DELETE_TIMEOUT=20
              ;;
            url-map|target-http-proxy|target-tcp-proxy|target-grpc-proxy|region-http-lb|global-forwarding-rule)
              # Load-balancer chains create 3-5 dependent resources serially
              # (health-check -> backend-service -> url-map -> proxy -> rule).
              # The CRUD lifecycle already runs ~4m13s on a good day - 84% of
              # the 5m default - so any per-op or operator-startup jitter tips
              # it over. Give the chain headroom.
              TIMEOUT_ARG="TIMEOUT=15"
              export FORMAE_TEST_DISCOVERY_TIMEOUT=15
              export FORMAE_TEST_OOB_TIMEOUT=15
              export FORMAE_TEST_OOB_DELETE_TIMEOUT=15
              ;;
            eventarc-pipeline|eventarc-message-bus)
              # An Eventarc message bus takes ~5-6 min to create and the pipeline
              # case builds one first, so a single apply runs past the 5m default
              # (6m20s locally for the re-apply, 22m for the whole lifecycle).
              # 15m still was not enough for Update under CI load, which timed
              # out after the case had already spent 19m; give it the same 30m
              # as Cloud SQL and AlloyDB.
              TIMEOUT_ARG="TIMEOUT=30"
              export FORMAE_TEST_DISCOVERY_TIMEOUT=30
              export FORMAE_TEST_OOB_TIMEOUT=30
              export FORMAE_TEST_OOB_DELETE_TIMEOUT=20
              ;;
            security-policy|region-security-policy|security-policy-rule|region-security-policy-rule)
              # A Cloud Armor policy insert is a slow global/regional operation
              # and the rule cases build one as a prerequisite first;
              # region-security-policy timed out on Create at the 5m default.
              TIMEOUT_ARG="TIMEOUT=15"
              export FORMAE_TEST_DISCOVERY_TIMEOUT=15
              export FORMAE_TEST_OOB_TIMEOUT=15
              export FORMAE_TEST_OOB_DELETE_TIMEOUT=15
              ;;
            machine-image)
              # A machine image snapshots every disk of an instance, and the case
              # builds the VM chain (network -> subnet -> disk -> instance) first.
              # It runs ~7m30s end to end locally, so the 5m default leaves no
              # room for the image capture itself under CI load.
              TIMEOUT_ARG="TIMEOUT=15"
              export FORMAE_TEST_DISCOVERY_TIMEOUT=15
              export FORMAE_TEST_OOB_TIMEOUT=15
              export FORMAE_TEST_OOB_DELETE_TIMEOUT=15
              ;;
            instance-group)
              # Creates a VM chain (network -> subnet -> boot-disk -> instance)
              # then the group + synchronous member attach, and the update does
              # removeInstances + setNamedPorts. More serial work than a plain
              # instance, so give it the same headroom as the LB chains.
              TIMEOUT_ARG="TIMEOUT=15"
              export FORMAE_TEST_DISCOVERY_TIMEOUT=15
              export FORMAE_TEST_OOB_TIMEOUT=15
              export FORMAE_TEST_OOB_DELETE_TIMEOUT=15
              ;;
            filestore-instance)
              # Filestore BASIC/BASIC_HDD is zonal: its location must be a zone,
              # not a region. The shared GCP_LOCATION secret is a region, so
              # override it with the zone for this test only.
              export GCP_LOCATION="$GCP_ZONE"
              ;;
          esac
          # Cases whose prerequisite outlives the crud phase run their two
          # phases separately with a cleanup in between. Conformance Destroy only
          # removes the resource under test, so the prerequisite survives and the
          # discovery phase then either collides with it by name (Cloud Armor
          # policies: "The resource ... already exists") or runs out of quota
          # (5 AlloyDB clusters per region, 1 Eventarc message bus per region).
          # See clean-case-prereqs.sh.
          case "${{ matrix.test-case }}" in
            alloydb-*|eventarc-*|security-policy-rule|region-security-policy-rule|\
            network-firewall-policy-association|region-network-firewall-policy-association|\
            network-firewall-policy-rule|machine-image)
              # "|| status=$?" keeps a failing phase from aborting the step
              # before its cleanup runs; the case still fails at the end.
              TC="${{ matrix.test-case }}"
              CLEAN="./scripts/ci/clean-case-prereqs.sh"
              crud_status=0
              make conformance-test-crud-run \
                TEST="$TC" PARALLEL=1 $TIMEOUT_ARG || crud_status=$?
              "$CLEAN" "$TC"
              discovery_status=0
              make conformance-test-discovery-run \
                TEST="$TC" PARALLEL=1 $TIMEOUT_ARG || discovery_status=$?
              "$CLEAN" "$TC"
              [ "$crud_status" -eq 0 ] && [ "$discovery_status" -eq 0 ]
              ;;
            *)
              make conformance-test-crud-run conformance-test-discovery-run \
                TEST=${{ matrix.test-case }} PARALLEL=1 $TIMEOUT_ARG
              ;;
          esac

  # Clean up test resources after all conformance tests (always runs)
  post-cleanup:
    needs: [conformance-tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Clean test resources
        run: ./scripts/ci/clean-environment.sh

  # Notify when build is fixed (was red, now green)
  notify-fixed:
    needs: [build, test-unit, lint, pkl-validate, verify-schema, conformance-tests, post-cleanup]
    runs-on: ubuntu-latest
    if: success() && github.event_name == 'push'
    steps:
      - name: Check if previous run failed
        id: check_previous
        uses: actions/github-script@v9
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: context.ref.replace('refs/heads/', ''),
              per_page: 2,
              status: 'completed'
            });

            // Get previous run (skip current which isn't completed yet)
            const previousRun = runs.data.workflow_runs.find(run => run.id !== context.runId);

            if (previousRun && previousRun.conclusion === 'failure') {
              return 'true';
            }
            return 'false';
          result-encoding: string

      - name: Notify Slack (Fixed)
        if: steps.check_previous.outputs.result == 'true'
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":white_check_mark: CI fixed on ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":white_check_mark: *CI fixed* on `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

  # Notify on failure
  notify-failure:
    needs: [build, test-unit, lint, pkl-validate, verify-schema, conformance-tests, post-cleanup]
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'push'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: CI failed on ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *CI failed* on `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
